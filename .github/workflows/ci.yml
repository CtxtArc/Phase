name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (host + ARM Cortex-M3 under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi qemu-system-arm
      - name: cargo test
        env:
          # Fail instead of skipping the QEMU test if the tools are missing.
          PHASE_REQUIRE_HW_TOOLS: "1"
        run: cargo test --workspace
      - name: Volatile proof demo (naive C vs PHASE at -O2)
        run: ./demos/m6_volatile_proof/run_demo.sh
      - name: Bug-gallery transcript is up to date
        run: |
          ./scripts/capture_bug_gallery.sh
          git diff --exit-code docs/bug_gallery_transcript.md
