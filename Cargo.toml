[workspace]
resolver = "2"
members = [
    "crates/ast",
    "crates/lexer",
    "crates/parser",
    "crates/analysis",
    "crates/pir",
    "crates/codegen_c",
    "crates/driver",
    "crates/fuzz",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "Apache-2.0"
description = "PHASE: a compiler that statically checks physical-domain safety (DMA, MMIO, devices) for hardware pipelines"
